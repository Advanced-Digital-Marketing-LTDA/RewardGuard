[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardguard"
version = "0.2.1"
description = "Pre-commit and pre-merge check for reward hacking by AI coding agents (Jest, Vitest, Playwright) using the Jev decision model, with Claude Haiku explaining what Jev flags."
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE", "COMMERCIAL.md"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
rewardguard = "rewardguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rewardguard = ["content_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
