[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardguard"
version = "0.1.0"
description = "Pre-commit and pre-merge check for reward hacking by AI coding agents (Jest, Vitest, Playwright) using the Jev decision model, with Claude Haiku explaining what Jev flags."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rewardguard = "rewardguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
