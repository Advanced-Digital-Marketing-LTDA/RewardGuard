name: rewardguard
description: Reviews commits for test gaming and content defects using static checks, optional tests, Jev probabilities, and focused Claude Haiku feedback.
branding:
  icon: shield
  color: red

# Use in two jobs (see examples/rewardguard.yml):
#   mode: tests  - runs the branch's test suites. Give it NO secrets: it executes branch code.
#   mode: check  - static checks, Jev and Haiku, plus the tests job's results. Never runs branch code.
# Or skip test runs (run_tests = false in .rewardguard.toml) and use one job with
# mode: check and tests: "false" (see examples/rewardguard-no-tests.yml).

inputs:
  mode:
    description: '"tests" (run branch tests, no secrets) or "check" (judge and report, needs secrets).'
    required: true
  tests:
    description: Check mode only. "true" reads the results uploaded by a mode-tests job; "false" when .rewardguard.toml sets run_tests = false and there is no tests job.
    required: false
    default: "true"
  typesafe-api-key:
    description: TypeSafe API key for Jev. Check mode only.
    required: false
    default: ""
  claude-code-oauth-token:
    description: Claude subscription token from `claude setup-token`, used by the Claude Haiku explainer. Check mode only.
    required: false
    default: ""
  base:
    description: Base commit/ref. Defaults to the PR base SHA or push before SHA; first pushes use the default branch or its parent.
    required: false
    default: ""
  policy-base:
    description: Immutable trusted policy commit supplied by the snapshot resolver.
    required: false
    default: ""
  head:
    description: Immutable reviewed head (must match checkout and event).
    required: false
    default: ""
  comment:
    description: Post or update the report as a PR comment ("true"/"false"). Check mode only.
    required: false
    default: "true"
  content-checks:
    description: Publish individual content rule checks (requires checks:write). Check mode only.
    required: false
    default: "true"
  github-token:
    description: Token used to post the PR comment and content checks. Check mode only.
    required: false
    default: ${{ github.token }}

outputs:
  base:
    description: Resolved comparison baseline commit.
    value: ${{ steps.base.outputs.ref }}
  head:
    description: Resolved checked-out head commit.
    value: ${{ steps.base.outputs.head }}
  policy-base:
    description: Resolved trusted policy commit.
    value: ${{ steps.base.outputs.policy }}
  review-artifact-id:
    description: Uploaded trusted report artifact ID; authenticate metadata before consuming.
    value: ${{ steps.review_upload.outputs.artifact-id }}
  review-artifact-digest:
    description: Uploaded report archive digest; does not prove model correctness.
    value: ${{ steps.review_upload.outputs.artifact-digest }}
  publication-outcome:
    description: Actual scoped-check/comment publication outcome, independent of judge findings.
    value: ${{ steps.content_checks.outcome }}
  review-upload-outcome:
    description: Actual trusted review report upload outcome.
    value: ${{ steps.review_upload.outcome }}
  judge-exit:
    description: Original judge exit code, independent of later publication/upload failures.
    value: ${{ steps.check.outputs.exit_code }}
  result:
    description: '"passed", "failed", "incomplete" or "skipped" (check mode)'
    value: ${{ steps.final_result.outputs.result }}

runs:
  using: composite
  steps:
    - name: Validate mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        HAS_SECRET: ${{ inputs.typesafe-api-key != '' || inputs.claude-code-oauth-token != '' }}
      run: |
        case "$MODE" in
          tests)
            if [ "$HAS_SECRET" = "true" ]; then
              echo "::error::mode: tests runs branch code and must not be given secrets."
              exit 2
            fi ;;
          check) ;;
          *) echo "::error::mode must be 'tests' or 'check'"; exit 2 ;;
        esac

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: "3.12"

    - name: Install rewardguard
      shell: bash
      run: python -I -m pip install --quiet "${{ github.action_path }}"

    - name: Restore authenticated Jev results
      id: jev_restore
      continue-on-error: true # A cache outage must not affect the review verdict.
      if: inputs.mode == 'check'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/rewardguard-jev-cache
        key: rewardguard-jev-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          rewardguard-jev-v1-${{ runner.os }}-

    - name: Report Jev archive restore
      if: always() && inputs.mode == 'check'
      continue-on-error: true # Diagnostics cannot change the review verdict.
      shell: bash
      env:
        CACHE_REQUESTED: rewardguard-jev-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        CACHE_PREFIX: rewardguard-jev-v1-${{ runner.os }}-
        CACHE_MATCHED: ${{ steps.jev_restore.outputs.cache-matched-key }}
        CACHE_HIT: ${{ steps.jev_restore.outputs.cache-hit }}
        CACHE_OUTCOME: ${{ steps.jev_restore.outcome }}
        CACHE_DIR: ${{ runner.temp }}/rewardguard-jev-cache
      run: |
        python -I - <<'PY'
        import json, os, re
        requested = os.environ.get('CACHE_REQUESTED', '')
        prefix = os.environ.get('CACHE_PREFIX', '')
        matched = os.environ.get('CACHE_MATCHED', '')
        hit = os.environ.get('CACHE_HIT', '')
        outcome = os.environ.get('CACHE_OUTCOME', '')
        safe_prefix = re.fullmatch(r'rewardguard-jev-v1-(Linux|Windows|macOS)-', prefix)
        safe_requested = safe_prefix and re.fullmatch(re.escape(prefix) + r'[0-9]+-[0-9]+', requested)
        safe_matched = safe_prefix and re.fullmatch(re.escape(prefix) + r'[0-9]+-[0-9]+', matched)
        print('Jev archive requested key:', requested if safe_requested else 'unavailable')
        print('Jev archive restore prefix:', prefix if safe_prefix else 'unavailable')
        print('Jev archive restore step outcome:', outcome if outcome in ('success', 'failure', 'cancelled', 'skipped') else 'unavailable')
        print('Jev archive matched key:', matched if safe_matched else 'unavailable')
        count_error = None
        if outcome == 'success' and safe_matched:
            status = 'exact hit' if hit == 'true' and matched == requested else 'prefix hit' if hit == 'false' and matched != requested else 'restored; match type unavailable'
            count = 0
            try:
                with os.scandir(os.environ['CACHE_DIR']) as entries:
                    for index, entry in enumerate(entries):
                        if index >= 100000:
                            count = None
                            count_error = 'entry_limit_exceeded'
                            break
                        if re.fullmatch(r'[0-9a-f]{64}\.json', entry.name) and entry.is_file(follow_symlinks=False):
                            count += 1
            except FileNotFoundError:
                count = None
                count_error = 'directory_missing'
            except PermissionError:
                count = None
                count_error = 'permission_denied'
            except OSError:
                count = None
                count_error = 'filesystem_error'
            except KeyError:
                count = None
                count_error = 'directory_unavailable'
            except ValueError:
                count = None
                count_error = 'invalid_directory'
        else:
            status = 'miss (no matched key reported)' if outcome == 'success' and not matched else 'unavailable'
            count = None
        print('Jev archive restore:', status)
        print('Jev archive restored entry files:', count if count is not None else 'unavailable', '(not authenticated-result hits)')
        if count_error:
            print('Jev archive entry count failure:', count_error)
        print(json.dumps({'kind': 'jev_archive_restore', 'requested_key': requested if safe_requested else None,
                          'prefix': prefix if safe_prefix else None, 'matched_key': matched if outcome == 'success' and safe_matched else None,
                          'outcome': outcome if outcome in ('success', 'failure', 'cancelled', 'skipped') else 'unavailable',
                          'status': status, 'restored_count': count, 'entry_count_error': count_error}, separators=(',', ':'), sort_keys=True))
        PY

    - name: Resolve base
      id: base
      shell: bash
      env:
        BASE_INPUT: ${{ inputs.base }}
        POLICY_INPUT: ${{ inputs.policy-base }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_REF: ${{ github.ref }}
        EXPECTED_HEAD: ${{ inputs.head || github.event.pull_request.head.sha || github.sha }}
      run: |
        set -euo pipefail
        fail() { echo "::error::$*" >&2; exit 2; }
        git_safe() { git -c core.fsmonitor=false -c core.hooksPath=/dev/null "$@"; }
        head="$(git_safe rev-parse --verify --quiet 'HEAD^{commit}')" || fail "Cannot resolve checked-out head."
        if [ -n "$EXPECTED_HEAD" ] && [ "$head" != "$EXPECTED_HEAD" ]; then
          fail "Checkout does not match the event head; check out the exact reviewed SHA."
        fi
        resolve_ref() {
          local candidate="$1" resolved
          if resolved="$(git_safe rev-parse --verify --quiet --end-of-options "${candidate}^{commit}")"; then
            printf '%s\n' "$resolved"; return
          fi
          if resolved="$(git_safe rev-parse --verify --quiet --end-of-options "refs/remotes/origin/${candidate}^{commit}")"; then
            printf '%s\n' "$resolved"; return
          fi
          git_safe fetch --no-tags --quiet -- origin "$candidate" || return 1
          git_safe rev-parse --verify --quiet 'FETCH_HEAD^{commit}'
        }
        base="${BASE_INPUT:-${PR_BASE_SHA:-${BASE_REF:-}}}"
        policy="${POLICY_INPUT:-}"
        if [[ "$EVENT_NAME" == pull_request* ]]; then
          target="${PR_BASE_SHA:-${BASE_REF:-$base}}"
          [ -n "$target" ] || fail "No trusted PR target snapshot."
          target="$(resolve_ref "$target")" || fail "Cannot resolve PR target."
          base="$(git_safe merge-base "$target" "$head")" || fail "PR target and head have no common history."
          policy="$base"
        else
          if [ "$EVENT_NAME" = push ] && [[ "$base" =~ ^0+$ ]]; then base=""; fi
          if [ -z "$base" ] && [ "$EVENT_NAME" = push ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ]; then
            base="$(resolve_ref "$base")" || fail "Cannot resolve the selected base commit/ref."
          fi
          if [ "$EVENT_NAME" = push ] && [ -z "$policy" ]; then
            [ -n "$DEFAULT_BRANCH" ] || fail "No trusted policy: default branch is unknown."
            if [ "$EVENT_REF" = "refs/heads/$DEFAULT_BRANCH" ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              policy="$(resolve_ref "$PUSH_BEFORE")" || fail "Cannot resolve trusted previous default tip."
            else
              default_base="$(resolve_ref "refs/remotes/origin/$DEFAULT_BRANCH")" || default_base=""
              if [ -z "$default_base" ]; then
                default_base="$(resolve_ref "refs/heads/$DEFAULT_BRANCH")" || default_base=""
              fi
              if [ "$default_base" = "$head" ] && [ "$EVENT_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                default_base="$(git_safe rev-parse --verify --quiet 'HEAD^1^{commit}')" ||
                  fail "No trusted baseline for the initial root commit; set a trusted policy explicitly."
              fi
              [ -n "$default_base" ] || fail "No trusted default-branch baseline."
              policy="$default_base"
              if [ -z "$base" ]; then
                [ "$default_base" != "$head" ] || fail "A new branch cannot silently compare head with itself."
                base="$default_base"
              fi
            fi
          fi
          [ -n "$base" ] || fail "No base commit/ref. Use a PR/push event or supply a trusted snapshot."
          # Outside GitHub event resolution, the explicitly supplied base is the caller's trusted policy default.
          policy="${policy:-$base}"
        fi
        policy="$(resolve_ref "$policy")" || fail "Cannot resolve trusted policy snapshot."
        printf 'ref=%s\nhead=%s\npolicy=%s\n' "$base" "$head" "$policy" >> "$GITHUB_OUTPUT"

    # ---- tests mode: runs branch code, holds no secrets ----
    - name: Run test suites
      if: inputs.mode == 'tests'
      shell: bash
      env:
        BASE: ${{ steps.base.outputs.ref }}
        POLICY_BASE: ${{ steps.base.outputs.policy }}
        REVIEW_HEAD: ${{ steps.base.outputs.head }}
      run: python -I -m rewardguard.cli run-tests --base "$BASE" --head "$REVIEW_HEAD" --comparison-mode explicit --policy-base "$POLICY_BASE" --out "$RUNNER_TEMP/rewardguard-run.json"

    - name: Upload run results
      if: inputs.mode == 'tests'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: rewardguard-run-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rewardguard-run.json
        if-no-files-found: error

    # ---- check mode: judges the diff, never runs branch code ----
    - name: Install Claude Code CLI
      if: inputs.mode == 'check'
      shell: bash
      run: npm install -g --silent @anthropic-ai/claude-code@2.1.308

    - name: Preflight reviewed PR head
      id: freshness
      if: inputs.mode == 'check'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REVIEW_HEAD: ${{ steps.base.outputs.head }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        pr=()
        if [ -n "$PR" ]; then pr=(--pr "$PR"); fi
        python -I -m rewardguard.publisher --preflight --repo "$REPO" --head "$REVIEW_HEAD" "${pr[@]}"

    - name: Run rewardguard
      if: inputs.mode == 'check' && steps.freshness.outputs.state == 'current'
      id: check
      shell: bash
      env:
        REWARDGUARD_CACHE_DIR: ${{ runner.temp }}/rewardguard-jev-cache
        REWARDGUARD_EVENT_ACTION: ${{ github.event.action }}
        REWARDGUARD_ACTION_REVISION: ${{ github.action_ref }}
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        BASE: ${{ steps.base.outputs.ref }}
        POLICY_BASE: ${{ steps.base.outputs.policy }}
        GH_TOKEN: ${{ inputs.github-token }}
        REVIEW_HEAD: ${{ steps.base.outputs.head }}
        TESTS: ${{ inputs.tests }}
      run: |
        # --no-local-tests: this job holds the secrets, so it never runs branch code
        results=()
        if [ "$TESTS" = "true" ]; then
          results=(--test-artifact)
        fi
        rm -f "$RUNNER_TEMP/rewardguard.md" "$RUNNER_TEMP/rewardguard.json"
        set +e
        python -I -m rewardguard.cli check --base "$BASE" --head "$REVIEW_HEAD" --comparison-mode explicit --policy-base "$POLICY_BASE" --no-local-tests --require-complete "${results[@]}" \
          --markdown "$RUNNER_TEMP/rewardguard.md" --json "$RUNNER_TEMP/rewardguard.json"
        code=$?
        set -e
        if [ -f "$RUNNER_TEMP/rewardguard.md" ]; then
          cat "$RUNNER_TEMP/rewardguard.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::error::RewardGuard produced no Markdown report; inspect the judge error above."
        fi
        case "$code" in
          0) echo "result=passed" >> "$GITHUB_OUTPUT" ;;
          3) echo "result=incomplete" >> "$GITHUB_OUTPUT" ;;
          *) echo "result=failed" >> "$GITHUB_OUTPUT" ;;
        esac
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"

    - name: Save authenticated Jev results
      id: jev_save
      continue-on-error: true # Saving an optimization must not affect the review verdict.
      if: always() && inputs.mode == 'check' && steps.check.outcome != 'skipped'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/rewardguard-jev-cache
        key: rewardguard-jev-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Report Jev archive save
      if: always() && inputs.mode == 'check'
      continue-on-error: true # Diagnostics cannot change the review verdict.
      shell: bash
      env:
        CACHE_OUTCOME: ${{ steps.jev_save.outcome }}
        CACHE_REQUESTED: rewardguard-jev-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
        CACHE_PREFIX: rewardguard-jev-v1-${{ runner.os }}-
      run: |
        python -I - <<'PY'
        import json, os, re
        outcome = os.environ.get('CACHE_OUTCOME', '')
        requested = os.environ.get('CACHE_REQUESTED', '')
        prefix = os.environ.get('CACHE_PREFIX', '')
        safe_prefix = re.fullmatch(r'rewardguard-jev-v1-(Linux|Windows|macOS)-', prefix)
        safe_requested = safe_prefix and re.fullmatch(re.escape(prefix) + r'[0-9]+-[0-9]+', requested)
        print('Jev archive save step outcome:', outcome if outcome in ('success', 'failure', 'cancelled', 'skipped') else 'unavailable')
        print('Jev archive save confirmation: unavailable from action outputs; inspect save logs')
        print(json.dumps({'kind': 'jev_archive_save', 'requested_key': requested if safe_requested else None,
                          'prefix': prefix if safe_prefix else None, 'matched_key': None,
                          'outcome': outcome if outcome in ('success', 'failure', 'cancelled', 'skipped') else 'unavailable',
                          'status': 'unavailable', 'restored_count': None}, separators=(',', ':'), sort_keys=True))
        PY

    - name: Upload trusted review evidence
      id: review_upload
      if: always() && inputs.mode == 'check' && steps.check.outputs.exit_code != ''
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: rewardguard-review-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/rewardguard.json
        if-no-files-found: error

    - name: Publish scoped content checks and stable PR report
      if: always() && inputs.mode == 'check' && steps.check.outputs.exit_code != '' && (inputs.content-checks == 'true' || inputs.comment == 'true')
      id: content_checks
      continue-on-error: true # Preserve the original judge exit if publication also fails.
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REVIEW_HEAD: ${{ steps.base.outputs.head }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        CHECKS: ${{ inputs.content-checks }}
        COMMENT: ${{ inputs.comment }}
      run: |
        pr=()
        if [ -n "$PR" ]; then pr=(--pr "$PR"); fi
        python -I -m rewardguard.publisher --report "$RUNNER_TEMP/rewardguard.json" --head "$REVIEW_HEAD" --repo "$REPO" --checks "$CHECKS" --comment "$COMMENT" "${pr[@]}"

    - name: Set result
      id: final_result
      if: always() && inputs.mode == 'check'
      shell: bash
      env:
        JUDGE_EXIT: ${{ steps.check.outputs.exit_code }}
        PUBLISH_OUTCOME: ${{ steps.content_checks.outcome }}
        PUBLISH_ENABLED: ${{ inputs.content-checks == 'true' || inputs.comment == 'true' }}
        FRESHNESS: ${{ steps.freshness.outputs.state }}
        EVIDENCE_OUTCOME: ${{ steps.review_upload.outcome }}
      run: |
        echo "result=failed" >> "$GITHUB_OUTPUT"
        if [ "$FRESHNESS" = stale ]; then
          echo "::notice::Superseded head: no providers or publication were run."
          echo "result=skipped" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        case "$JUDGE_EXIT" in
          0) ;;
          3) echo "result=incomplete" >> "$GITHUB_OUTPUT"; exit 3 ;;
          [1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5]) exit "$JUDGE_EXIT" ;;
          *) echo "::error::RewardGuard judge did not produce a valid result."; exit 2 ;;
        esac
        case "$PUBLISH_ENABLED:$PUBLISH_OUTCOME" in
          true:success|false:skipped) ;;
          *) echo "::error::Scoped content checks could not be published completely."; exit 2 ;;
        esac
        if [ "$EVIDENCE_OUTCOME" != success ]; then
          echo "::error::Trusted machine report artifact was not uploaded."
          exit 2
        fi
        echo "result=passed" >> "$GITHUB_OUTPUT"
