name: rewardguard
description: Fails a pull request when an AI coding agent may have gamed its tests (Jest, Vitest, Playwright), using static checks, real test runs, the Jev decision model, and Claude Haiku to explain what Jev flags.
branding:
  icon: shield
  color: red

# Use in two jobs (see examples/rewardguard.yml):
#   mode: tests  - runs the branch's test suites. Give it NO secrets: it executes branch code.
#   mode: check  - static checks, Jev and Haiku, plus the tests job's results. Never runs branch code.
# Or skip test runs (run_tests = false in .rewardguard.toml) and use one job with
# mode: check and tests: "false" (see examples/rewardguard-no-tests.yml).

inputs:
  mode:
    description: '"tests" (run branch tests, no secrets) or "check" (judge and report, needs secrets).'
    required: true
  tests:
    description: Check mode only. "true" reads the results uploaded by a mode-tests job; "false" when .rewardguard.toml sets run_tests = false and there is no tests job.
    required: false
    default: "true"
  typesafe-api-key:
    description: TypeSafe API key for Jev. Check mode only.
    required: false
    default: ""
  claude-code-oauth-token:
    description: Claude subscription token from `claude setup-token`, used by the Claude Haiku explainer. Check mode only.
    required: false
    default: ""
  base:
    description: Base ref to compare against. Defaults to the PR's base branch.
    required: false
    default: ""
  comment:
    description: Post or update the report as a PR comment ("true"/"false"). Check mode only.
    required: false
    default: "true"
  github-token:
    description: Token used to read PR reviews (code-owner approval of CI changes) and post the PR comment. Check mode only.
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: '"passed" or "failed" (check mode)'
    value: ${{ steps.check.outputs.result }}

runs:
  using: composite
  steps:
    - name: Validate mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        HAS_SECRET: ${{ inputs.typesafe-api-key != '' || inputs.claude-code-oauth-token != '' }}
      run: |
        case "$MODE" in
          tests)
            if [ "$HAS_SECRET" = "true" ]; then
              echo "::error::mode: tests runs branch code and must not be given secrets."
              exit 2
            fi ;;
          check) ;;
          *) echo "::error::mode must be 'tests' or 'check'"; exit 2 ;;
        esac

    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install rewardguard
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Resolve base
      id: base
      shell: bash
      env:
        BASE_INPUT: ${{ inputs.base }}
        # github.base_ref is empty on pull_request_review events; the event payload has it on both
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        base="${BASE_INPUT:-$BASE_REF}"
        if [ -z "$base" ]; then
          echo "::error::No base ref. Run on pull_request events or set the 'base' input."
          exit 2
        fi
        # checkout with fetch-depth: 0 already has it; fetch only if missing
        git rev-parse --verify --quiet "origin/$base" > /dev/null || git fetch --no-tags --quiet origin "$base"
        echo "ref=origin/$base" >> "$GITHUB_OUTPUT"

    # ---- tests mode: runs branch code, holds no secrets ----
    - name: Run test suites
      if: inputs.mode == 'tests'
      shell: bash
      env:
        BASE: ${{ steps.base.outputs.ref }}
      run: rewardguard run-tests --base "$BASE" --head HEAD --out "$RUNNER_TEMP/rewardguard-run.json"

    - name: Upload run results
      if: inputs.mode == 'tests'
      uses: actions/upload-artifact@v7
      with:
        name: rewardguard-run
        path: ${{ runner.temp }}/rewardguard-run.json
        if-no-files-found: error

    # ---- check mode: judges the diff, never runs branch code ----
    - name: Install Claude Code CLI
      if: inputs.mode == 'check'
      shell: bash
      run: npm install -g --silent @anthropic-ai/claude-code@2.1.308

    - name: Download run results
      if: inputs.mode == 'check' && inputs.tests == 'true'
      uses: actions/download-artifact@v8
      with:
        name: rewardguard-run
        path: ${{ runner.temp }}/rewardguard-run

    - name: Run rewardguard
      if: inputs.mode == 'check'
      id: check
      shell: bash
      env:
        TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        BASE: ${{ steps.base.outputs.ref }}
        TESTS: ${{ inputs.tests }}
        # reads PR reviews for the code-owner exception to CHECKER_CONFIG_CHANGED (needs pull-requests: read)
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # --no-local-tests: this job holds the secrets, so it never runs branch code
        results=()
        if [ "$TESTS" = "true" ]; then
          results=(--run-results "$RUNNER_TEMP/rewardguard-run/rewardguard-run.json")
        fi
        set +e
        rewardguard check --base "$BASE" --head HEAD --no-local-tests "${results[@]}" \
          --markdown "$RUNNER_TEMP/rewardguard.md" --json "$RUNNER_TEMP/rewardguard.json"
        code=$?
        set -e
        cat "$RUNNER_TEMP/rewardguard.md" >> "$GITHUB_STEP_SUMMARY"
        if [ $code -eq 0 ]; then echo "result=passed" >> "$GITHUB_OUTPUT"; else echo "result=failed" >> "$GITHUB_OUTPUT"; fi
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: inputs.mode == 'check' && inputs.comment == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- rewardguard-report -->")) | .id' | tail -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/rewardguard.md" > /dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/rewardguard.md" > /dev/null
        fi

    - name: Set result
      if: inputs.mode == 'check'
      shell: bash
      run: exit ${{ steps.check.outputs.exit_code }}
