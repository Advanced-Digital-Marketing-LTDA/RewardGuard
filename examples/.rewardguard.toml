# Commit this to your BASE branch (e.g. main). rewardguard always reads it from the
# base commit, so a branch can't loosen its own check.

# If your test suite can't run in a workflow (too large, needs services), set this to
# false and drop install/[[suites]]: rewardguard then runs static checks, Jev and Haiku
# only. Use examples/rewardguard-no-tests.yml as the workflow.
# run_tests = false

# Run once in each clean checkout before the suites.
install = "npm ci"

# Each suite must write a Jest/Vitest/Playwright JSON report.
# {report} is replaced with the report path. Playwright also gets
# PLAYWRIGHT_JSON_OUTPUT_NAME set to the same path.
[[suites]]
name = "unit"
command = "npx vitest run --reporter=json --outputFile={report}"
# Jest:       "npx jest --json --outputFile={report}"

# [[suites]]
# name = "e2e"
# command = "npx playwright test --reporter=json"

# Severity is fixed: a Jev probability below 0.60 is not reported, 0.60-0.79 warns, 0.80 or higher fails.
# Jev judges every changed text file and grades every finding that isn't clear-cut.

[judge]
model = "jev-1.13.0"   # pin a version; jev-latest is rejected
# max_state_chars = 90000
# context_lines = 20
# concurrency = 4

# Jev only answers yes/no. Every Jev finding that is reported (0.60 or higher) goes to Claude Haiku
# (via the `claude` CLI, billed to the subscription behind CLAUDE_CODE_OAUTH_TOKEN), which names
# the lines and the problem. Haiku never clears a finding.
[explainer]
model = "claude-haiku-5-5"
effort = "low"
# timeout_seconds = 300

# [paths]
# test_globs = ["**/*.{test,spec}.{js,jsx,ts,tsx,mjs,cjs,mts,cts}", "**/__tests__/**", "**/{test,tests,e2e}/**"]
# exclude = ["**/node_modules/**", "**/dist/**"]

# Turn a rule off with "off"; severities can't be changed.
[rules]
# SNAPSHOT_CHANGED = "off"

# Content review uses explicit trusted-base public-source declarations.
# No declarations (the default) means no content grading; code/test checks continue.
# Fixed defect thresholds: below 0.60 ignored, [0.60,0.80) warning, >=0.80 failure.
[content]
enabled = true
packs = [] # All website-supported packs; artifact scope and evidence still filter rules.

# include/source_include only narrow these declarations. Mandatory exclusions remain.
# include = ["content/articles/**", "content/products/**", "src/components/**"]
# source_include = ["src/components/**/*.svelte"]

# Replace these sample public paths/routes with the project's actual publication sources.
[[content.publications]]
id = "articles"
sources = ["content/articles/**/*.md", "content/articles/**/*.mdx"]
type = "article"
route = "/articles/{stem}"
published = true
drafts = false
dependencies = ["footer"]
evidence = ["B", "P"]

[[content.publications]]
id = "footer"
sources = ["src/components/Footer.svelte"]
type = "component"
route = "/_shared/footer"

[[content.publications]]
id = "products"
sources = ["content/products/*.json"]
type = "product"
route = "/products/{stem}"
fields = ["title", "description", "features.*.label"]
evidence = ["B"]

# Only declared, existing trusted-base paths bound by each publication are supplied.
# Missing necessary evidence is not_evaluated; it is not an invented finding/pass.
# No automatic discovery, imports, Git history, builds or network collectors.
[content.context]
# B = [".rewardguard/content-context.md"] # Product/audience/offer facts
# P = [".rewardguard/content-policy.md"]  # Explicit adopted artifact policy
# S = [".rewardguard/content-sources.json"] # Inspectable external fact evidence
# R = [".rewardguard/content-rendered.md"] # Supplied render/runtime observations
# M = [".rewardguard/content-measurements.json"] # Supplied measured behavior
