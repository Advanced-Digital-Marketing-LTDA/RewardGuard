# Commit this to your BASE branch (e.g. main). rewardguard always reads it from the
# base commit, so a branch can't loosen its own check.

# If your test suite can't run in a workflow (too large, needs services), set this to
# false and drop install/[[suites]]: rewardguard then runs static checks, Jev and Haiku
# only. Use examples/rewardguard-no-tests.yml as the workflow.
# run_tests = false

# Run once in each clean checkout before the suites.
install = "npm ci"

# Each suite must write a Jest/Vitest/Playwright JSON report.
# {report} is replaced with the report path. Playwright also gets
# PLAYWRIGHT_JSON_OUTPUT_NAME set to the same path.
[[suites]]
name = "unit"
command = "npx vitest run --reporter=json --outputFile={report}"
# Jest:       "npx jest --json --outputFile={report}"

# [[suites]]
# name = "e2e"
# command = "npx playwright test --reporter=json"

# Severity is fixed: a Jev probability below 0.60 is not reported, 0.60-0.79 warns, 0.80 or higher fails.
# Jev judges every changed text file and grades every finding that isn't clear-cut.

[judge]
model = "jev-1.13.0"   # pin a version; jev-latest is rejected
# max_state_chars = 90000
# context_lines = 20
# concurrency = 4

# Jev only answers yes/no. Every Jev finding that is reported (0.60 or higher) goes to Claude Haiku
# (via the `claude` CLI, billed to the subscription behind CLAUDE_CODE_OAUTH_TOKEN), which names
# the lines and the problem. Haiku never clears a finding.
[explainer]
model = "claude-haiku-5-5"
effort = "low"
# timeout_seconds = 300

# [paths]
# test_globs = ["**/*.{test,spec}.{js,jsx,ts,tsx,mjs,cjs,mts,cts}", "**/__tests__/**", "**/{test,tests,e2e}/**"]
# exclude = ["**/node_modules/**", "**/dist/**"]

# Turn a rule off with "off"; severities can't be changed.
[rules]
# SNAPSHOT_CHANGED = "off"

# Content review is part of the existing rewardguard check command.
# Exactly 0.60 enters content review; independent findings warn at 0.60 and fail at 0.80.
# rewardguard check --content-only returns success when no eligible content changed.
[content]
enabled = true
packs = [] # All packs are eligible; Jev applicability and evidence still filter checks.

# Optional complete path-list overrides. Omit these to retain packaged defaults.
# Keep editorial/UI copy, metadata/schema and publication controls in scope as needed.
# include = ["content/**", "src/pages/**", "public/robots.txt", "public/sitemap*.xml"]
# source_include = ["src/**/*.astro", "src/**/*.svelte", "src/**/*.tsx"]
# exclude = ["vendor/**", "generated/vendor/**"]
# evidence_exclude controls evidence independently; omit it to retain internal-doc
# exclusions even for explicit [content.context] references. Overrides replace the
# complete list; preserve internal/test/generated paths when opting in public docs.

# Repository-relative files read from the trusted BASE revision, never the candidate.
# Replace examples with real existing evidence paths. These do not run collectors or scripts.
# Missing necessary evidence is not_evaluated, not a finding or a claimed pass.
# Dates are required only when material to the particular claim.
[content.context]
# B = [".rewardguard/content-context.md"]              # Product/audience/offer facts and brief
# P = [".rewardguard/content-policy.md"]                 # Explicit adopted artifact/platform policy
# I = [".rewardguard/content-inventory.json"]                 # Complete relevant route/product/record inventory
# S = [".rewardguard/content-sources.json"]        # Inspectable proof/source observations
# R = [".rewardguard/content-rendered.md"]        # Supplied resolved/rendered/runtime observations
# M = [".rewardguard/content-measurements.json"]       # Inputs, definitions, formulas and denominators
# H = [".rewardguard/content-history.md"]      # Publication/version/history evidence
